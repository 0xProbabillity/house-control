# The Xcode project is generated from this file: `xcodegen generate` (scripts/build-ios.sh does it).
name: HouseControl
options:
  bundleIdPrefix: io.github.0xprobabillity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HouseCore:
    path: ../core
targets:
  HouseControl:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # The web UI, built by `npm run build` in ../web; lands in the app as the folder "dist".
      - path: ../web/dist
        type: folder
        buildPhase: resources
    dependencies:
      - package: HouseCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: House Control
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: House Control looks for your Mac on this Wi-Fi network to receive the floor plan you made there.
        NSBonjourServices: [_housecontrol._tcp]
        NSCameraUsageDescription: The camera reads the pairing code shown by House Control on your Mac.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.0xprobabillity.HouseControl.pair
            CFBundleURLSchemes: [housecontrol]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.0xprobabillity.HouseControl
        PRODUCT_NAME: HouseControl
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  HouseControl:
    build:
      targets:
        HouseControl: all
    run:
      config: Debug
    archive:
      config: Release
