# The Xcode project is generated from this file: `xcodegen generate` (scripts/build-ios.sh does it).
# This is the App Store edition: Home Assistant, Philips Hue and Apple Home. The edition with
# Smart Life on top (TestFlight, own use) is project-smartlife.yml, which includes this file.
name: HouseControl
options:
  bundleIdPrefix: io.github.0xprobabillity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HouseCore:
    path: ../core
settings:
  base:
    # The text the app and the widgets show comes from the String Catalogs (Localizable,
    # InfoPlist), English as the base; Xcode fills them from the code (docs/localization.md).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
# The permission texts differ between the editions (the Smart Life one also scans with the
# camera and saves to Photos), and InfoPlist.xcstrings is keyed by the Info.plist key, so each
# edition has its own catalog: Resources/AppStore here, Resources/SmartLife in
# project-smartlife.yml, which replaces this template's sources.
targetTemplates:
  Edition:
    sources:
      - path: Resources/AppStore
targets:
  HouseControl:
    type: application
    platform: iOS
    templates: [Edition]
    sources:
      - path: Sources
      - path: Resources
        excludes: [AppStore, SmartLife]
      # The intent the "House Control" control runs to open the app: both sides have to know it.
      - path: ../widgets/Sources/OpenApp.swift
      # The web UI, built by `npm run build` in ../web; lands in the app as the folder "dist".
      - path: ../web/dist
        type: folder
        buildPhase: resources
    dependencies:
      - package: HouseCore
      - target: HouseWidgets
        embed: true
    entitlements:
      path: Config/HouseControl.entitlements
      properties:
        com.apple.developer.homekit: true
        # Shared with the widgets: the home they draw, and the connections they use.
        com.apple.security.application-groups: [$(HOUSE_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.0xprobabillity.HouseControl]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: House Control
        HouseAppGroup: $(HOUSE_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Any way up but upside down on an iPhone (held sideways the model and the controls sit
        # side by side), any way on an iPad. iPhone Duo's inner screen takes any shape
        # regardless, and only an app that can be resized gets all of it (and a place beside
        # another app, as on an iPad) rather than a phone-sized column in the middle.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: House Control finds your Home Assistant and Hue Bridge on this Wi-Fi network, and your Mac or PC, to keep your floor plan the same on both.
        NSBonjourServices: [_housecontrol._tcp, _hue._tcp, _home-assistant._tcp]
        NSHomeKitUsageDescription: House Control shows the lamps, air conditioners and thermometers of your homes in its 3D view and switches them for you.
        # Home Assistant answers plain HTTP on the local network, the Hue Bridge HTTPS with its own certificate.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Says what this edition does with the camera; the Smart Life edition adds the LiDAR scan.
        NSCameraUsageDescription: The camera reads the pairing code shown by House Control on your Mac or PC.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.0xprobabillity.HouseControl.pair
            CFBundleURLSchemes: [housecontrol]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.0xprobabillity.HouseControl3D
        # Shared with the widgets: the home they draw, and the actions they queue.
        HOUSE_APP_GROUP: group.io.github.0xprobabillity.HouseControl3D
        PRODUCT_NAME: HouseControl
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
  # Home Screen, Lock Screen and StandBy widgets plus Control Center controls (../widgets).
  HouseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../widgets/Sources
      - path: ../widgets/Resources
        buildPhase: resources
    dependencies:
      - package: HouseCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: ../widgets/Config/iOS.entitlements
      properties:
        com.apple.security.application-groups: [$(HOUSE_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.0xprobabillity.HouseControl]
    info:
      path: ../widgets/Config/Info-iOS.plist
      properties:
        CFBundleDisplayName: House Control
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HouseAppGroup: $(HOUSE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.0xprobabillity.HouseControl3D.Widgets
        HOUSE_APP_GROUP: group.io.github.0xprobabillity.HouseControl3D
        PRODUCT_NAME: HouseWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  HouseControl:
    build:
      targets:
        HouseControl: all
    run:
      config: Debug
    archive:
      config: Release
